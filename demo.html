<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Riati — Live Clinical Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --aub:#4F2D57; --aub-d:#2E1834; --cream:#FAF7F3; --lilac:#EDE6F2; --line:#E6DDE9;
  --gold:#B8892E; --ink:#1F1520; --mut:#6B5C70; --body:#4A3B4E;
  --green:#1F6F5B; --amber:#C9822B; --red:#A8323E;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0;background:var(--cream);color:var(--ink);-webkit-font-smoothing:antialiased}
body{font-family:'IBM Plex Sans Arabic','Newsreader',system-ui,sans-serif;font-size:14px}
a{color:var(--aub);text-decoration:none}
input,select,button{font:inherit}
input[type=number]{direction:ltr;text-align:center}
input:focus,select:focus{outline:2px solid var(--aub);outline-offset:1px}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(168,50,62,.5)}50%{box-shadow:0 0 0 12px rgba(168,50,62,0)}}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.5);opacity:1}}
.serif{font-family:'Newsreader','Amiri',serif;font-weight:400}
.kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.btn{border:1px solid #D9CCE3;background:transparent;color:var(--aub);border-radius:999px;padding:8px 16px;font-size:13px;cursor:pointer}
.btn:hover{background:var(--lilac)}
.btn-primary{background:var(--aub);color:var(--cream);border:0}
.btn-primary:hover{background:var(--aub-d)}
.btn-danger{background:var(--red);color:#fff;border:0}
.seg{display:inline-flex;gap:4px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px}
.seg button{border:0;border-radius:999px;padding:6px 13px;font-size:13px;cursor:pointer;background:transparent;color:var(--aub)}
.seg button.on{background:var(--aub);color:var(--cream)}
.num{width:64px;border:1px solid #D9CCE3;border-radius:8px;padding:4px 6px;font-size:13px;background:var(--cream);color:var(--ink)}
.num.small{width:52px}
select.sel{border:1px solid #D9CCE3;border-radius:8px;padding:5px 8px;font-size:13px;background:var(--cream);color:var(--ink);max-width:100%}
.tile{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px 10px;position:relative;overflow:hidden}
.tile .lbl{font-size:12px;color:var(--mut)}
.tile .val{font-family:'Newsreader',serif;font-size:34px;color:var(--aub-d);line-height:1.1;margin:2px 0 0}
.tile .val small{font-size:14px;color:var(--mut)}
.tile .sub{font-size:11px;color:var(--mut);min-height:14px}
.tile.warn{border-color:var(--amber)}
.tile.crit{border-color:var(--red);animation:pulse 2s infinite}
.log-entry{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff;animation:rise .45s both}
.log-entry .lt{font-size:11px;color:var(--mut)}
.log-entry .ttl{font-size:14px;font-weight:600;color:var(--aub-d);margin:2px 0}
.log-entry .bd{font-size:13px;color:var(--body);line-height:1.55}
.log-entry.e-alert{border-inline-start:4px solid var(--amber)}
.log-entry.e-alarm{border-inline-start:4px solid var(--red);background:#FDF4F5}
.log-entry.e-therapy{border-inline-start:4px solid var(--aub)}
.log-entry.e-report{border-inline-start:4px solid var(--gold);background:#FDFBF6}
.log-entry.e-ai{border-inline-start:4px solid var(--line)}
.rep-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:10px 0}
.rep-cell{background:var(--cream);border-radius:10px;padding:8px 10px}
.rep-cell .k{font-size:11px;color:var(--mut)}
.rep-cell .v{font-family:'Newsreader',serif;font-size:19px;color:var(--aub-d)}
.rep-cell .r{font-size:11px;color:var(--mut)}
.zonechip{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600;color:#fff}
.rule{display:flex;flex-wrap:wrap;align-items:center;gap:6px;border-top:1px solid var(--line);padding:10px 0;font-size:13px;color:var(--body)}
.rule .word{color:var(--mut);font-size:12px}
.rule .metr{font-weight:600;color:var(--aub-d)}
.rule .act{color:var(--aub);font-weight:600}
.rule .cite{font-size:10px;letter-spacing:.06em;color:var(--gold);border:1px solid var(--gold);border-radius:999px;padding:1px 7px}
.rule.off{opacity:.42}
.rgroup{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:600;margin:12px 0 2px}
.switch{appearance:none;width:34px;height:20px;border-radius:999px;background:#D9CCE3;position:relative;cursor:pointer;flex:none;margin:0}
.switch:checked{background:var(--green)}
.switch::after{content:'';position:absolute;top:2px;inset-inline-start:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s}
.switch:checked::after{transform:translateX(14px)}
[dir=rtl] .switch:checked::after{transform:translateX(-14px)}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-size:12px;cursor:pointer;color:var(--aub)}
.chip.on{background:var(--aub);color:var(--cream);border-color:var(--aub)}
#alarmbar{position:sticky;top:0;z-index:90;display:none;background:var(--red);color:#fff;padding:12px 20px;align-items:center;gap:14px;animation:pulse 1.6s infinite}
#alarmbar.show{display:flex}
#alarmbar .t{font-weight:600;font-size:15px;flex:1}
header.top{position:sticky;top:0;z-index:80;background:rgba(250,247,243,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);border-top:3px dashed var(--gold)}
.wrap{max-width:1280px;margin:0 auto;padding-inline:20px}
.hrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:10px}
main{max-width:1280px;margin:0 auto;padding:22px 20px 60px;display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:20px;align-items:start}
@media(max-width:980px){main{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}
footer{border-top:1px solid var(--line);background:#fff}
footer .wrap{padding-block:26px;font-size:12.5px;color:var(--mut);line-height:1.7}
.dot{width:9px;height:9px;border-radius:50%;background:var(--green);display:inline-block;animation:breathe 2.4s ease-in-out infinite}
h3.cardt{margin:0 0 4px;font-family:'Newsreader','Amiri',serif;font-weight:400;font-size:22px;color:var(--aub-d)}
.mut{color:var(--mut)}
.tiny{font-size:12px;color:var(--mut);line-height:1.55}
</style>
</head>
<body>

<header class="top"><div class="wrap hrow">
  <a href="Riati.dc.html" style="display:flex;align-items:center;gap:9px">
    <img src="assets/logo.png" alt="Riati" style="width:36px;height:36px;object-fit:contain">
    <span class="serif" style="font-size:19px;color:var(--aub)">Riati <span style="color:var(--gold);font-weight:300">|</span> <span style="font-family:'Amiri',serif">رئتي</span></span>
  </a>
  <span class="kicker" id="hSub"></span>
  <div style="margin-inline-start:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
    <div class="serif" id="clock" style="font-size:20px;color:var(--aub-d);min-width:130px;text-align:center" dir="ltr">Day 1 · 08:00</div>
    <div class="seg" id="speedSeg"></div>
    <button class="btn btn-primary" id="playBtn"></button>
    <button class="btn" id="resetBtn"></button>
    <button class="btn" id="liveBtn"></button>
    <button class="btn" id="langBtn"></button>
  </div>
</div></header>

<div id="alarmbar"><span style="font-size:22px">⏺</span><span class="t" id="alarmTxt"></span><button class="btn" style="background:#fff;color:var(--red);border:0" id="ackBtn"></button></div>

<main>
<div class="col">
  <!-- patient -->
  <div class="card" style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:16px 20px">
    <div style="width:48px;height:48px;border-radius:50%;background:var(--lilac);display:grid;place-items:center" class="serif"><span style="font-size:22px;color:var(--aub)" id="pInitial">A</span></div>
    <div style="flex:1;min-width:220px">
      <div style="font-weight:600;color:var(--aub-d);font-size:16px" id="pName"></div>
      <div class="tiny" id="pLine"></div>
    </div>
    <span style="border:1px dashed var(--gold);color:var(--gold);border-radius:999px;padding:5px 12px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600" id="pSim"></span>
    <span class="zonechip" id="news2Chip" hidden style="animation:pulse 2s infinite" dir="ltr"></span>
    <span class="zonechip" id="zoneChip"></span>
  </div>

  <!-- vitals -->
  <div>
    <div class="kicker" style="margin:2px 0 10px" id="kMon"></div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px" id="tiles"></div>
  </div>

  <!-- chart -->
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:6px">
      <div class="serif" style="font-size:20px;color:var(--aub-d)" id="chTitle"></div>
      <div style="display:flex;gap:14px;font-size:11px;color:var(--mut);flex-wrap:wrap" id="chLegend"></div>
    </div>
    <div id="chart"></div>
  </div>

  <!-- log -->
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px">
      <h3 class="cardt" id="kLog"></h3>
      <div style="display:flex;gap:6px;flex-wrap:wrap" id="filters"></div>
    </div>
    <div id="log" style="display:flex;flex-direction:column;gap:10px;max-height:560px;overflow-y:auto"></div>
  </div>
</div>

<div class="col">
  <!-- AI -->
  <div class="card" style="background:var(--aub-d);border-color:var(--aub-d);color:var(--cream)">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
      <span class="dot"></span>
      <div class="serif" style="font-size:22px" id="kAI"></div>
    </div>
    <div style="font-size:13px;color:#C9B8D1;line-height:1.55" id="aiStatus"></div>
    <div id="liveStatus" style="font-size:12px;line-height:1.5;color:#D4B26A;margin-top:8px;word-break:break-all" hidden></div>
    <div style="background:rgba(255,255,255,.06);border:1px solid rgba(217,204,227,.2);border-radius:14px;padding:12px 14px;margin-top:12px">
      <div style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#D4B26A;font-weight:600" id="aiLastL"></div>
      <div style="font-size:13.5px;line-height:1.55;margin-top:5px" id="aiLast">—</div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap">
      <div style="flex:1;min-width:150px">
        <div style="font-size:11px;color:#C9B8D1" id="nextRepL"></div>
        <div class="serif" style="font-size:20px" id="nextRep" dir="ltr">—</div>
      </div>
      <select class="sel" id="repInt" style="background:rgba(255,255,255,.08);border-color:rgba(217,204,227,.3);color:var(--cream)"></select>
      <button class="btn" style="border-color:rgba(217,204,227,.4);color:var(--cream)" id="repNowBtn"></button>
    </div>
  </div>

  <!-- standing orders -->
  <div class="card">
    <h3 class="cardt" id="kOrders"></h3>
    <p class="tiny" style="margin:0 0 8px" id="ordersNote"></p>
    <div style="background:var(--cream);border-radius:14px;padding:12px 14px;margin-bottom:6px">
      <div style="display:flex;align-items:center;gap:8px">
        <input type="checkbox" class="switch" id="o2on" checked>
        <span style="font-weight:600;color:var(--aub-d);font-size:13px" id="o2title"></span>
        <span class="rule cite" style="border:1px solid var(--gold);color:var(--gold);border-radius:999px;padding:1px 7px;font-size:10px">AARC 2022</span>
      </div>
      <div class="tiny" style="margin-top:6px;display:flex;flex-wrap:wrap;gap:4px;align-items:center" id="o2words"></div>
    </div>
    <div id="rules"></div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center;border-top:1px solid var(--line);padding-top:12px;margin-top:2px" id="addRow"></div>
    <div style="display:flex;justify-content:flex-end;margin-top:10px"><button class="btn" id="resetOrdersBtn" style="font-size:12px"></button></div>
  </div>

  <!-- direct actions -->
  <div class="card">
    <h3 class="cardt" id="kTher"></h3>
    <p class="tiny" style="margin:0 0 10px" id="therNote"></p>
    <div style="display:flex;flex-wrap:wrap;gap:8px" id="therBtns"></div>
    <div style="display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap">
      <span style="font-size:13px;color:var(--body)" id="o2lbl"></span>
      <div class="seg"><button id="o2minus" dir="ltr">−1</button><button id="o2plus" dir="ltr">+1</button></div>
      <span class="serif" style="font-size:22px;color:var(--aub-d)" id="o2now" dir="ltr">0 L/min</span>
      <button class="btn" id="o2stop" style="font-size:12px"></button>
    </div>
  </div>

  <!-- scenario -->
  <div class="card">
    <h3 class="cardt" id="kScen"></h3>
    <div style="display:flex;flex-direction:column;gap:8px;margin-top:8px" id="scenBtns"></div>
    <div style="margin-top:14px">
      <label style="display:block;font-size:12px;color:var(--mut)"><span id="slDetL"></span> <span id="slDetV" class="mut"></span>
      <input type="range" id="slDet" min="50" max="160" value="100" style="width:100%;accent-color:var(--aub)"></label>
      <label style="display:block;font-size:12px;color:var(--mut);margin-top:8px"><span id="slRespL"></span> <span id="slRespV" class="mut"></span>
      <input type="range" id="slResp" min="0" max="100" value="85" style="width:100%;accent-color:var(--aub)"></label>
    </div>
    <p class="tiny" style="margin:10px 0 0" id="scenNote"></p>
  </div>
</div>
</main>

<footer><div class="wrap">
  <div id="ftCites"></div>
  <div style="margin-top:8px" id="ftDisc"></div>
</div></footer>

<script>

/* ================= i18n ================= */

const LIVE = {on:false, data:{}, ok:false, url:'', seen:false};
const FRESH = {hr:15, spo2:120, rr:120, sbp:1440, dbp:1440, temp:240, wt:1440, borg:240}; // minutes a live reading stays valid before the simulation resumes for that field
function liveFresh(k){ const d=LIVE.data[k]; return d && (Date.now()-d.ts)/60000 <= FRESH[k] ? d : null; }
function applyLive(v){ for(const k of Object.keys(FRESH)){ const d=liveFresh(k); if(d) v[k] = (k==='temp'||k==='wt') ? +(+d.v).toFixed(1) : Math.round(+d.v); } }
async function pollLive(){
  if(!LIVE.on) return;
  try{
    const r = await fetch('live?ts='+Date.now(), {cache:'no-store'}); const j = await r.json();
    LIVE.ok = true; LIVE.data = j.data||{}; LIVE.url = 'http://'+j.ip+':'+j.port+'/ingest?hr=72&spo2=96';
    const newest = Math.max(0, ...Object.values(LIVE.data).map(d=>d.ts||0));
    if(newest > (LIVE.lastTs||0)){ LIVE.lastTs = newest; applyLive(S.vit); renderTiles(); }   // show a new reading at once, not at the next minute tick
    if(!LIVE.seen && Object.keys(LIVE.data).length){ LIVE.seen=true; log('ai', ()=>t('eLiveFirst')(Object.keys(LIVE.data).map(k=>t('m'+k)).join(', '))); }
  }catch(e){ LIVE.ok=false; }
  renderLiveStatus();
}
function renderLiveStatus(){
  el.liveBtn.textContent = LIVE.on ? t('liveBtnOn') : t('liveBtnOff');
  el.liveBtn.classList.toggle('btn-primary', LIVE.on);
  el.liveStatus.hidden = !LIVE.on;
  if(!LIVE.on) return;
  if(!LIVE.ok){ el.liveStatus.textContent = t('liveNoBridge'); return; }
  const fresh = Object.keys(FRESH).filter(k=>liveFresh(k));
  if(!fresh.length){ el.liveStatus.textContent = t('liveWait')(LIVE.url); return; }
  const newest = Math.max(...fresh.map(k=>LIVE.data[k].ts));
  el.liveStatus.textContent = t('liveOk')(fresh.map(k=>t('m'+k)).join(' · '), Math.max(0, Math.round((Date.now()-newest)/60000)));
}

}

/* ================= patient model ================= */
function cardioEvents(m){
  if(S.scen!=='cardiac') return {hrEp:0, wtBase:0, sbpEp:0};
  const d=S.detRate;
  const bump=(start,rise,peak,tau)=>{ const age=m-start; if(age<0) return 0; return age<=rise ? peak*age/rise : peak*Math.exp(-(age-rise)/tau); };
  return {
    hrEp:   bump(40,15,30*d,600),                              // sustained fast rate (AF-like); persists for hours if untreated
    wtBase: Math.min(2.4*d, 0.014*m*d),                        // fluid retention creeping up through the day
    sbpEp:  bump(330,20,72*d,240) + bump(700,20,-36*d,150)     // hypertensive spike, then a post-diuresis dip
  };
}
function baseSeverity(m){
  const d = S.detRate;
  if(S.scen==='moderate'||S.scen==='cardiac'){
    // stable baseline; brief episodes flare up, then resolve (faster once treated)
    // cardiac day opens with a firm respiratory episode so the salbutamol → tachycardia → β-blocker interlock is exercised
    if(!S.epi.active && m>=S.epi.next) S.epi.active={start:m, peak:(S.scen==='cardiac'&&m<60 ? 3.3 : 2.2+Math.random()*1.2)*d, rise:22, fall:85};
    let ep=0;
    const a=S.epi.active;
    if(a){
      const age=m-a.start;
      ep = age<=a.rise ? a.peak*(age/a.rise) : a.peak*Math.exp(-(age-a.rise)/a.fall);
      if(age>a.rise && ep<0.2){ S.epi.active=null; S.epi.next=m+160+Math.random()*220; }
    }
    return 2.1 + 0.25*Math.sin(m/47) + ep;
  }
  if(S.scen==='severe')   return 3.6 + 7.2*d*Math.min(1, m/100);
  return 2 + 0.5*Math.sin(m/38) * d;
}
function drugEffect(m){

    const age = m - d.at; if(age<0) continue;
    let e=0;
    if(d.rx==='salb'){ e = d.mag * Math.min(1,age/14) * Math.exp(-Math.max(0,age-14)/110); if(e>0.15) salbActive++; }
    else if(d.rx==='ipra'){ e = d.mag * Math.min(1,age/20) * Math.exp(-Math.max(0,age-20)/220); }
    else if(d.rx==='pred'){ e = d.mag * Math.min(1,age/240); }
    else if(d.rx==='bb'){ const k=Math.min(1,age/60)*Math.exp(-Math.max(0,age-60)/800); hrEff+=d.mag*k; sbpEff+=6*k; }
    else if(d.rx==='diur'){ const k=Math.min(1,age/90)*Math.exp(-Math.max(0,age-90)/900); wtEff+=d.mag*k; sbpEff+=5*k; }
    else if(d.rx==='amlo'){ const k=Math.min(1,age/240)*Math.exp(-Math.max(0,age-240)/1200); sbpEff+=d.mag*k; }
    else if(d.rx==='holdbp'){ const k=Math.min(1,age/60)*Math.exp(-Math.max(0,age-60)/400); sbpEff-=8*k; }
    b+=e;
  }
  return {b, salbActive, hrEff, sbpEff, wtEff};
}
function news2(v,onO2){
  const s={};
  s.rr = v.rr<=8?3 : v.rr<=11?1 : v.rr<=20?0 : v.rr<=24?2 : 3;
  // Scale 2 (hypercapnic, prescribed 88–92)
  const sp=v.spo2;
  if(sp<=83) s.spo2=3; else if(sp<=85) s.spo2=2; else if(sp<=87) s.spo2=1; else if(sp<=92) s.spo2=0;
  else s.spo2 = onO2 ? (sp<=94?1: sp<=96?2:3) : 0;
  s.o2 = onO2?2:0;
  s.sbp = v.sbp<=90?3 : v.sbp<=100?2 : v.sbp<=110?1 : v.sbp<=219?0 : 3;
  s.hr = v.hr<=40?3 : v.hr<=50?1 : v.hr<=90?0 : v.hr<=110?1 : v.hr<=130?2 : 3;
  s.temp = v.temp<=35?3 : v.temp<=36?1 : v.temp<=38?0 : v.temp<=39?1 : 2;
  const total = s.rr+s.spo2+s.o2+s.sbp+s.hr+s.temp;
  const single3 = Math.max(s.rr,s.spo2,s.sbp,s.hr,s.temp)>=3;
  return {total, single3, s};
}
const rnd = (()=>{ let seed=7; return ()=>{ seed=(seed*9301+49297)%233280; return seed/233280-0.5; };})();
function stepMinute(m){
  S.resp = +el.slResp.value/100; S.detRate = +el.slDet.value/100;
  const {b, salbActive, hrEff, sbpEff, wtEff} = drugEffect(m);
  const Seff = Math.max(0, Math.min(12, baseSeverity(m) - b));
  const ce = cardioEvents(m);
  const o2boost = S.o2>0 ? 5.4*(1-Math.exp(-S.o2/2.6)) : 0;
  const v = S.vit;
  const tgt = {
    spo2: Math.max(70, Math.min(99.5, 97.2 - 1.45*Seff + o2boost)),
    hr:   Math.max(45, 78 + 4.6*Seff + 8*salbActive + (v.spo2<86?12:0) + ce.hrEp - hrEff),
    rr:   13.5 + 2.1*Seff,
    sbp:  Math.max(70, 121 + 1.8*Seff + ce.sbpEp - sbpEff),
    temp: 36.7 + (S.scen==='severe'?0.16:0.06)*Seff,
    borg: Math.max(0, Math.min(10, 0.9 + 0.85*Seff)),
    wt:   0.2 + ce.wtBase - wtEff
  };
  v.spo2 = Math.round((v.spo2 + (tgt.spo2-v.spo2)*.28 + rnd()*.7)*10)/10;
  v.hr   = Math.round(v.hr   + (tgt.hr-v.hr)*.3  + rnd()*3.4);
  v.rr   = Math.round(v.rr   + (tgt.rr-v.rr)*.3  + rnd()*1.4);
  v.sbp  = Math.round(v.sbp  + (tgt.sbp-v.sbp)*.25+ rnd()*4);
  v.dbp  = Math.round(0.6*v.sbp + 4 + rnd()*3);
  v.temp = Math.round((v.temp+ (tgt.temp-v.temp)*.2 + rnd()*.08)*10)/10;
  v.borg = Math.round((v.borg+ (tgt.borg-v.borg)*.3+ rnd()*.3)*2)/2;
  v.wt   = Math.round((v.wt  + (tgt.wt-v.wt)*.2   + rnd()*.06)*10)/10;
  if(LIVE.on) applyLive(v);   // real device readings override the simulated ones for whatever fields arrived
  const nw = news2(v, S.o2>0);
  v.news2 = nw.total; S.news2Score = nw;
  S.hist.push({m, spo2:v.spo2, hr:v.hr, rr:v.rr, sbp:v.sbp, dbp:v.dbp, temp:v.temp, borg:v.borg, wt:v.wt, news2:v.news2, o2:S.o2});
  if(S.hist.length>1500) S.hist.shift();
  aiTick(m, v, nw);
}

/* ================= AI engine ================= */
function log(type, mkTitle, mkBody, extra){
  const e = {id:++S.evSeq, m:S.minute, type, mkTitle, mkBody:mkBody||null, ...extra};
  S.events.push(e); if(S.events.length>300) S.events.shift();
  renderNewEntry(e);
  if(type!=='report') setAiLast(e);
  return e;
}
function setAiLast(e){ el.aiLast.textContent = fmtT(e.m)+' — '+e.mkTitle(); }
function alarmOn(mkTitle){
  S.alarm = {mkTitle, at:S.minute};
  el.alarmTxt.textContent = mkTitle();
  el.alarmbar.classList.add('show');
  beep(2);
}
function opTest(op,a,b){ return op==='<'?a<b : op==='<='?a<=b : op==='>'?a>b : a>=b; }
function giveDrug(rx, by, m){
  const v=S.vit, nm=()=>t(DRUGNAME[rx]);
  // a withheld order is explained once per hour, not on every re-evaluation
  const note=(key,mk)=>{ if(S.skipNoted[key]!==undefined && m-S.skipNoted[key]<60) return; S.skipNoted[key]=m; log('ai', mk); };
  if(rx==='salb'){
    if(S.sabaHoldUntil>m) return false;
    if(m - S.drugLast.salb < DRUG.salb.cd) return false;
    S.salbTimes = S.salbTimes.filter(x=>m-x<60);
    if(S.salbTimes.length>=3){
      if(!S.sabaMaxFlag){ S.sabaMaxFlag=true; log('alert', ()=>t('eSabaMax')); }
      return false;
    }
  } else if(m - S.drugLast[rx] < DRUG[rx].cd) return false;
  // safety interlocks — checked against the live readings before any cardiac or BP order
  if(rx==='bb'){
    if(m - S.drugLast.salb < 60){ note('bbSaba', ()=>t('eSkipBBSaba')); return false; }
    if(v.sbp<100){ note('bbLow', ()=>t('eSkipLowBP')(nm())); return false; }
    if(v.hr<100) return false;
  }
  if(rx==='diur' && v.sbp<100){ note('diurLow', ()=>t('eSkipLowBP')(nm())); return false; }
  if(rx==='amlo' && v.sbp<150){ note('amloLow', ()=>t('eSkipAmlo')); return false; }
  if(rx==='salb'){ S.salbTimes.push(m); S.sabaMaxFlag=false; }
  S.drugLast[rx]=m;
  const mag = {salb:2.3, ipra:1.3, pred:1.6, bb:18, diur:1.0, amlo:14, holdbp:1}[rx]*S.resp;
  S.drugs.push({rx, at:m, mag});
  if(S.epi.active && (rx==='salb'||rx==='ipra')) S.epi.active.fall = Math.max(16, 70*(1-S.resp));
  log('therapy', rx==='holdbp' ? ()=>t('eHoldBP') : ()=>t('eGive')(nm()), ()=>t(by));
  if(DRUG[rx].check) S.checks.push({due:m+DRUG[rx].check, rx, base:{...S.vit}});
  return true;
}
function o2Set(f, mk){
  const was=S.o2; S.o2=Math.max(0,Math.min(proto.max,f));
  if(S.o2!==was){ log('therapy', mk); if(was<=4&&S.o2>4) log('ai',()=>t('eHumid')); }
}
function runAction(rule, m){
  const a=rule.action;
  if(a==='o2'){ if(proto.on && S.o2===0){ o2Set(proto.start, ()=>t('eO2Start')(proto.start)); S.checks.push({due:m+20, rx:'o2', base:{...S.vit}}); return true; } return false; }
  if(DRUG[a]) return giveDrug(a,'byAI',m);
  if(a==='notify'){ log('alert', rule.metric==='news2' ? ()=>t('eNews5')(S.vit.news2) : rule.metric==='temp' ? ()=>t('eTemp')(S.vit.temp) : ()=>t('eRuleFire')(t('m'+rule.metric), rule.op, rule.val)); return true; }
  if(a==='alarm'){ const mk=()=>t('eNews7')(S.vit.news2); log('alarm', mk); alarmOn(mk); sendReport(m,true); return true; }
  if(a==='hold'){ S.sabaHoldUntil=m+60; const mk=()=>t('eHold')(rule.val); log('alarm', mk); alarmOn(mk); return true; }
  return false;
}
function aiTick(m, v, nw){
  // standing orders
  for(const r of rules){
    if(!r.on) continue;
    const val = v[r.metric]; if(val==null) continue;
    S.sustain[r.id] = opTest(r.op, val, r.val) ? (S.sustain[r.id]||0)+1 : 0;
    if(S.sustain[r.id]>=r.sus && m-(S.ruleLast[r.id]??-99999)>=r.cd){
      const done = runAction(r,m);
      S.ruleLast[r.id] = done ? m : m - r.cd + 15; // an order withheld by an interlock is re-evaluated in 15 min, not after the full cooldown
    }
  }
  // O2 titration
  if(proto.on && S.o2>0 && m-proto.lastT>=proto.every){
    const recent = S.hist.slice(-5), mean = recent.reduce((a,h)=>a+h.spo2,0)/recent.length;
    if(mean < proto.low){
      if(S.o2 < proto.max){ proto.lastT=m; o2Set(S.o2+1, ()=>t('eO2Up')(S.o2+1)); }
      else if(m-S.o2MaxAlerted>30){ S.o2MaxAlerted=m; const mk=()=>t('eO2Max'); log('alarm',mk); alarmOn(mk); sendReport(m,true); }
    } else if(mean > proto.high){
      proto.lastT=m;
      if(S.o2>1) o2Set(S.o2-1, ()=>t('eO2Down')(S.o2-1));
      else { S.o2=0; log('therapy', ()=>t('eO2StopT')); }
    }
  }
  // effectiveness checks
  for(const c of S.checks.filter(c=>c.due===m)){
    let eff=false, whyK='';
    if(c.rx==='o2'){ eff = v.spo2>=proto.low; whyK='wSpo2'; }
    else if(c.rx==='bb'){ eff = v.hr<=c.base.hr-10; whyK='wHr'; }
    else if(c.rx==='diur'){ eff = v.wt<=c.base.wt-0.5; whyK='wWt'; }
    else if(c.rx==='amlo'){ eff = v.sbp<=c.base.sbp-10; whyK='wSbp'; }
    else if(c.rx==='holdbp'){ eff = v.sbp>=c.base.sbp+5; whyK='wSbpUp'; }
    else { eff = (v.borg<=c.base.borg-0.8)||(v.rr<=c.base.rr-3); whyK='wBorg'; }
    const nm = ()=> c.rx==='o2' ? 'O₂' : t(DRUGNAME[c.rx]);
    const mins = c.rx==='o2' ? 20 : DRUG[c.rx].check;
    if(eff){ S.ineff[c.rx]=0; log('ai', ()=>t('eEff')(nm(), t(whyK))); }
    else{
      S.ineff[c.rx]=(S.ineff[c.rx]||0)+1;
      const mk = ()=>t('eIneff')(nm(), mins);
      log(S.ineff[c.rx]>=2?'alarm':'alert', mk);
      if(S.ineff[c.rx]>=2) alarmOn(mk);
      sendReport(m,true);
    }
  }
  S.checks = S.checks.filter(c=>c.due>m);
  // scheduled report
  if(m - S.lastReport >= repInterval) sendReport(m,false);
}

/* ================= reports ================= */
function stat(win,k){
  const vals = win.map(h=>h[k]);
  const cur = vals[vals.length-1], mn=Math.min(...vals), mx=Math.max(...vals);
  const third = Math.max(1,Math.floor(vals.length/3));
  const a = vals.slice(0,third).reduce((x,y)=>x+y,0)/third;
  const b = vals.slice(-third).reduce((x,y)=>x+y,0)/third;
  const eps = {spo2:.6,hr:4,rr:1.5,sbp:4,temp:.2,borg:.5,wt:.3,news2:.7}[k]||1;
  return {cur, mn, mx, trend: b-a>eps?'↑': a-b>eps?'↓':'→'};
}
function zoneOf(nw){ return nw.total>=7?'R': (nw.total>=5||nw.single3)?'A':'G'; }
function sendReport(m, exception){
  const from=S.lastReport; S.lastReport=m;
  const win=S.hist.filter(h=>h.m>from&&h.m<=m); if(!win.length) return;
  const data={from,to:m,exception:!!exception,stats:{},o2:S.o2,news2:{...S.news2Score}};
  for(const k of METRICS) data.stats[k]=stat(win,k);
  data.zone = zoneOf(S.news2Score);
  data.therapies = S.events.filter(e=>e.type==='therapy'&&e.m>from&&e.m<=m).map(e=>({m:e.m, title:e.mkTitle}));
  data.alerts = S.events.filter(e=>e.type==='alert'&&e.m>from&&e.m<=m).length;
  data.alarms = S.events.filter(e=>e.type==='alarm'&&e.m>from&&e.m<=m).length;
  log('report', ()=>t('repTitle')(fmtT(from),fmtT(m)), null, {data});
}

  document.getElementById('nrAdd').onclick=()=>{
    const action=document.getElementById('nrA').value;
    rules.push({id:'c'+Date.now(),g:CARDIO_ACTIONS.includes(action)?'cardio':'resp',on:true,metric:document.getElementById('nrM').value,op:document.getElementById('nrO').value,val:+document.getElementById('nrV').value,sus:+document.getElementById('nrS').value,action,cd:20,builtin:false,cite:''});
    persistOrders(); renderOrders();
  };
}
function tileState(k,v){
  if(k==='spo2') return v<proto.low?'crit': v<proto.low+2&&S.o2===0?'warn':'';
  if(k==='hr') return v>=140?'crit': v>=120?'warn':'';
  if(k==='rr') return v>=30?'crit': v>=25?'warn':'';
  if(k==='news2') return v>=7?'crit': v>=5?'warn':'';
  if(k==='borg') return v>=7?'crit': v>=5?'warn':'';
  if(k==='temp') return v>=38.5?'warn':'';
  if(k==='sbp') return (v>=180||v<=90)?'crit': (v>=160||v<=100)?'warn':'';
  if(k==='wt') return v>=3?'crit': v>=2?'warn':'';
  return '';
}
function spark(k){
  const h=S.hist.slice(-45); if(h.length<2) return '';
  const vals=h.map(x=>x[k]); const mn=Math.min(...vals), mx=Math.max(...vals), sp=(mx-mn)||1;
  const pts=vals.map((v,i)=>((i*90)/(vals.length-1)).toFixed(1)+','+(24-((v-mn)/sp)*22+1).toFixed(1)).join(' ');
  return '<svg viewBox="0 0 90 26" style="position:absolute;bottom:6px;inset-inline-end:12px;width:90px;height:26px;opacity:.55" dir="ltr"><polyline points="'+pts+'" fill="none" stroke="#4F2D57" stroke-width="1.5"/></svg>';
}
function renderTiles(){
  const v=S.vit;
  el.tiles.innerHTML=TILES.map(k=>{
    const meta=MMETA[k], val = k==='sbp' ? v.sbp+'/'+v.dbp : fmtV(k,v[k]);
    const ld = LIVE.on ? liveFresh(k) : null;
    const sub = ld ? t('srcWatch')+' · '+new Date(ld.ts).toTimeString().slice(0,5)
              : k==='spo2' ? (S.o2>0? t('onO2')+' '+S.o2+' '+t('o2flowU') : t('air')) : '';
    return '<div class="tile '+tileState(k,v[k])+'"><div class="lbl">'+t('v'+VLBL[k])+'</div>'
      +'<div class="val" dir="ltr">'+val+'<small> '+(meta.u?t(meta.u):'')+'</small></div>'
      +'<div class="sub">'+sub+'</div>'+spark(k)+'</div>';
  }).join('');
}
function renderChart(){
  const Wm=180, h=S.hist.filter(x=>x.m>S.minute-Wm);
  if(h.length<2){ el.chart.innerHTML='<div style="padding:40px;text-align:center;color:var(--mut)">…</div>'; return; }
  const W=920,H=280,p=38;
  const x=m=>p+((m-h[0].m)*(W-2*p))/Math.max(1,(h[h.length-1].m-h[0].m));
  const ySp=v=>H-p-((v-78)/(100-78))*(H-2*p);
  const yHr=v=>H-p-((v-50)/(170-50))*(H-2*p);
  let out='<svg viewBox="0 0 '+W+' '+H+'" dir="ltr" style="width:100%;height:auto;display:block">';
  for(let i=0;i<=4;i++){ const vv=78+(22*i)/4, y=ySp(vv);
    out+='<line x1="'+p+'" x2="'+(W-p)+'" y1="'+y+'" y2="'+y+'" stroke="#EDE6F2"/><text x="'+(p-6)+'" y="'+(y+4)+'" font-size="10" fill="#6B5C70" text-anchor="end">'+Math.round(vv)+'%</text>'
      +'<text x="'+(W-p+6)+'" y="'+(y+4)+'" font-size="10" fill="#B9A8C0" text-anchor="start">'+Math.round(50+(120*i)/4)+'</text>'; }
  out+='<line x1="'+p+'" x2="'+(W-p)+'" y1="'+ySp(proto.low)+'" y2="'+ySp(proto.low)+'" stroke="#A8323E" stroke-dasharray="6 6" stroke-width="1.5"/>';
  out+='<line x1="'+p+'" x2="'+(W-p)+'" y1="'+yHr(140)+'" y2="'+yHr(140)+'" stroke="#A8323E" stroke-dasharray="2 5" stroke-width="1"/>';
  const path=(k,ys)=>h.map((d,i)=>(i?'L':'M')+x(d.m).toFixed(1)+','+ys(d[k]).toFixed(1)).join(' ');
  out+='<path d="'+path('hr',yHr)+'" fill="none" stroke="#9B7FA6" stroke-width="1.6" stroke-linejoin="round"/>';
  out+='<path d="'+path('spo2',ySp)+'" fill="none" stroke="#4F2D57" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>';
  h.forEach(d=>{ if(d.spo2<proto.low) out+='<circle cx="'+x(d.m).toFixed(1)+'" cy="'+ySp(d.spo2).toFixed(1)+'" r="3.6" fill="#C9822B" stroke="#fff" stroke-width="1.4"/>'; });
  for(const e of S.events){ if(e.type==='therapy'&&e.m>=h[0].m&&e.m<=h[h.length-1].m)
    out+='<g transform="translate('+x(e.m).toFixed(1)+','+(p-14)+')"><rect x="-4.5" y="-4.5" width="9" height="9" transform="rotate(45)" fill="#B8892E"/><line x1="0" x2="0" y1="8" y2="'+(H-p-(p-14))+'" stroke="#B8892E" stroke-opacity=".25" stroke-dasharray="3 4"/></g>'; }
  const step=Math.max(1,Math.ceil(h.length/6));
  h.forEach((d,i)=>{ if(i%step===0||i===h.length-1){ const tm=fmtT(d.m).split('· ')[1];
    out+='<text x="'+x(d.m).toFixed(1)+'" y="'+(H-p+16)+'" font-size="10" fill="#6B5C70" text-anchor="middle">'+tm+'</text>'; }});
  out+='</svg>';
  el.chart.innerHTML=out;
}
let logFilter='all', renderedIds=new Set();
function entryNode(e){
  const div=document.createElement('div');
  div.className='log-entry e-'+e.type; div.dataset.type=e.type; div.dataset.id=e.id;
  let inner='<div class="lt" dir="ltr">'+fmtT(e.m)+'</div><div class="ttl">'+((e.data&&e.data.exception)?'<span style="color:var(--red)">'+t('repExc')+'</span><br>':'')+e.mkTitle()+'</div>';
  if(e.data){ inner+=reportBody(e.data); }
  else if(e.mkBody){ inner+='<div class="bd">'+ (typeof e.mkBody==='function'? (T[L][e.mkBody]||e.mkBody()) : e.mkBody) +'</div>'; }
  div.innerHTML=inner;
  return div;
}
function reportBody(d){
  const cells=['spo2','hr','rr','sbp','borg','temp','wt','news2'].map(k=>{
    const s=d.stats[k]; if(!s) return '';
    return '<div class="rep-cell"><div class="k">'+t('v'+VLBL[k])+'</div>'
      +'<div class="v" dir="ltr">'+fmtV(k,s.cur)+' <span style="font-size:13px;color:var(--mut)">'+s.trend+'</span></div>'
      +'<div class="r" dir="ltr">'+t('rRange')+' '+fmtV(k,s.mn)+'–'+fmtV(k,s.mx)+'</div></div>';
  }).join('');
  const [zc,zk]=ZC[d.zone];
  const ther = d.therapies.length
    ? d.therapies.map(x=>'<div style="display:flex;gap:8px;font-size:13px;color:var(--body)"><span dir="ltr" style="color:var(--mut);flex:none">'+fmtT(x.m)+'</span><span>'+x.title()+'</span></div>').join('')
    : '<div class="bd" style="color:var(--mut)">'+t('rNone')+'</div>';
  return '<div class="rep-grid">'+cells+'</div>'
    +'<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:4px 0 8px"><span class="zonechip" style="background:'+zc+'">'+t(zk)+'</span>'
    +'<span class="tiny" dir="ltr">O₂ '+d.o2+' '+t('o2flowU')+' · '+d.alerts+' '+t('rAlerts')+' · '+d.alarms+' '+t('rAlarms')+'</span></div>'
    +'<div style="font-size:12px;font-weight:600;color:var(--aub-d);margin-bottom:3px">'+t('rTherapies')+'</div>'+ther
    +'<div style="border-top:1px dashed var(--line);margin-top:8px;padding-top:8px" class="bd"><b>'+t('rRec')+':</b> '+t(d.zone==='R'?'recR':d.zone==='A'?'recA':'recG')+'</div>';
}
function renderNewEntry(e){
  if(logFilter!=='all' && !(logFilter==='al'?(e.type==='alert'||e.type==='alarm'):e.type===logFilter)) { return; }
  el.log.prepend(entryNode(e)); renderedIds.add(e.id);
  while(el.log.children.length>150) el.log.lastChild.remove();
}
function renderLog(){
  el.log.innerHTML=''; renderedIds=new Set();
  const list=S.events.filter(e=> logFilter==='all' || (logFilter==='al'?(e.type==='alert'||e.type==='alarm'):e.type===logFilter));
  for(const e of list.slice(-150)) { el.log.prepend(entryNode(e)); renderedIds.add(e.id); }
}
function renderAll(){
  el.clock.textContent=fmtT(S.minute);
  const nw = S.news2Score.total!=null?S.news2Score:{total:0,single3:false};
  const [zc,zk]=ZC[zoneOf(nw)];
  el.zoneChip.style.background=zc; el.zoneChip.textContent=t(zk);
  if(nw.total>=7){ el.news2Chip.hidden=false; el.news2Chip.style.background='var(--red)'; el.news2Chip.textContent='NEWS2 '+nw.total+' · '+t('n2Emerg'); }
  else if(nw.total>=5||nw.single3){ el.news2Chip.hidden=false; el.news2Chip.style.background='var(--amber)'; el.news2Chip.textContent='NEWS2 '+nw.total+' · '+t('n2Urgent'); }
  else el.news2Chip.hidden=true;
  renderTiles(); renderChart();
  const rem=repInterval-(S.minute-S.lastReport);
  el.nextRep.textContent = rem>0 ? rem+' '+t('minW') : '…';
  el.o2now.textContent=S.o2+' '+t('o2flowU');
  renderLiveStatus();
}

/* ================= audio ================= */
let AC=null;
function unlockAudio(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } }
document.addEventListener('click', unlockAudio, {once:true});
function beep(n){ if(!AC) return; for(let i=0;i<n;i++){ const o=AC.createOscillator(),g=AC.createGain(); o.connect(g); g.connect(AC.destination); o.frequency.value=880; g.gain.setValueAtTime(.0001,AC.currentTime+i*.35); g.gain.exponentialRampToValueAtTime(.18,AC.currentTime+i*.35+.02); g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+i*.35+.28); o.start(AC.currentTime+i*.35); o.stop(AC.currentTime+i*.35+.3);} }

/* ================= controls ================= */
el.playBtn.onclick=()=>{ S.running=!S.running; el.playBtn.textContent=S.running?t('pause'):t('play'); };
el.resetBtn.onclick=()=>reset(S.scen);
el.liveBtn.onclick=toggleLive;
el.langBtn.onclick=()=>{ L=L==='en'?'ar':'en'; try{localStorage.setItem('riati_lang',L);}catch(e){} renderStatic(); };
el.ackBtn.onclick=()=>{ if(S.alarm){ S.alarm=null; el.alarmbar.classList.remove('show'); log('ai',()=>t('eAck')); } };
el.repNowBtn.onclick=()=>{ sendReport(S.minute,false); renderAll(); };
el.repInt.onchange=()=>{ repInterval=+el.repInt.value; persistOrders(); renderAll(); };
el.o2on.onchange=()=>{ proto.on=el.o2on.checked; persistOrders(); };
el.o2plus.onclick=()=>{ o2Set(S.o2+1, ()=> S.o2===0? t('eO2Start')(1):t('eO2Up')(Math.min(proto.max,S.o2+1))); renderAll(); };
el.o2minus.onclick=()=>{ if(S.o2>0){ const nf=S.o2-1; if(nf===0){ S.o2=0; log('therapy',()=>t('eO2StopT')); } else o2Set(nf,()=>t('eO2Down')(nf)); renderAll(); } };
el.o2stop.onclick=()=>{ if(S.o2>0){ S.o2=0; log('therapy',()=>t('eO2StopT')); renderAll(); } };
el.slDet.oninput=renderSliders; el.slResp.oninput=renderSliders;
el.resetOrdersBtn.onclick=()=>{ proto=defaultProto(); rules=defaultRules(); repInterval=60; persistOrders(); renderStatic(); };

function reset(scen){
  const speed=S?S.speed:60;
  S=freshState(scen); S.speed=speed;
  renderStatic();
}

/* ================= main loop ================= */
S=freshState('moderate');
renderStatic();
setInterval(()=>{
  if(!S.running) return;
  S.simSec+=S.speed*0.5;
  const target=Math.floor(S.simSec/60);
  let n=0;
  while(S.minute<target&&n<12){ S.minute++; n++; stepMinute(S.minute); }
  if(n) renderAll();
  if(S.alarm && AC && Date.now()-S.lastBeep>8000){ S.lastBeep=Date.now(); beep(2); }
},500);
</script>
</body>
